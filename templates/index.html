<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KV Kalimpong Chatbot</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Chat Container ── */
    .chat-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 90vh;
      max-height: 800px;
    }

    /* ── Header ── */
    .chat-header {
      background: #1a56a0;
      color: #ffffff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
      background: #ffffff33;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .chat-header .info h1 { font-size: 1rem; font-weight: 700; }
    .chat-header .info p  { font-size: 0.78rem; opacity: 0.8; margin-top: 2px; }

    /* ── Messages Area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .message.user  { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot   { align-self: flex-start; }

    .message .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: #1a56a0;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background: #f0f4f8;
      color: #1a202c;
      border-bottom-left-radius: 4px;
    }

    .message .icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .message.user .icon { background: #1a56a0; color: #fff; }
    .message.bot  .icon { background: #e2e8f0; }

    /* ── Loading indicator ── */
    .loading-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

    /* ── Input Area ── */
    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      background: #ffffff;
    }

    .input-area input {
      flex: 1;
      border: 1.5px solid #cbd5e0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      color: #1a202c;
    }

    .input-area input:focus { border-color: #1a56a0; }
    .input-area input:disabled { background: #f7fafc; color: #a0aec0; }

    .input-area button {
      background: #1a56a0;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .input-area button:hover:not(:disabled) { background: #1547889; }
    .input-area button:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Scrollbar ── */
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">🏫</div>
    <div class="info">
      <h1>KV Kalimpong Assistant</h1>
      <p>Kendriya Vidyalaya, Kalimpong</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <!-- Initial greeting -->
    <div class="message bot">
      <div class="icon">🤖</div>
      <div class="bubble">
        Hello! I'm the KV Kalimpong Assistant. Ask me anything about Kendriya Vidyalaya, Kalimpong — academics, activities, schedules, or anything school-related. How can I help you today?
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="Ask me about KV Kalimpong..."
      autocomplete="off"
    />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
  // ── Conversation history sent to the backend with each request ──
  const history = [];

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("userInput");
  const sendBtn    = document.getElementById("sendBtn");

  // Send on Enter key
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function setLoading(isLoading) {
    sendBtn.disabled  = isLoading;
    inputEl.disabled  = isLoading;
  }

  function appendMessage(role, text) {
    const isUser = role === "user";
    const wrapper = document.createElement("div");
    wrapper.className = `message ${isUser ? "user" : "bot"}`;

    const icon   = document.createElement("div");
    icon.className = "icon";
    icon.textContent = isUser ? "🧑" : "🤖";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrapper.appendChild(icon);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    scrollToBottom();
    return bubble; // return so we can update it (for the loading dots)
  }

  function showLoadingBubble() {
    const wrapper = document.createElement("div");
    wrapper.className = "message bot";
    wrapper.id = "loading-bubble";

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = "🤖";

    const bubble = document.createElement("div");
    bubble.className = "bubble loading-dots";
    bubble.innerHTML = "<span></span><span></span><span></span>";

    wrapper.appendChild(icon);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    scrollToBottom();
  }

  function removeLoadingBubble() {
    const el = document.getElementById("loading-bubble");
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    appendMessage("user", text);
    setLoading(true);
    showLoadingBubble();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history }),
      });

      const data = await response.json();
      removeLoadingBubble();

      if (!response.ok) {
        appendMessage("bot", "Sorry, something went wrong. Please try again.");
        console.error(data);
      } else {
        const reply = data.reply;
        appendMessage("bot", reply);

        // Update history so follow-up questions keep context
        history.push({ role: "user",  parts: [text] });
        history.push({ role: "model", parts: [reply] });
      }
    } catch (err) {
      removeLoadingBubble();
      appendMessage("bot", "Connection error. Please check that the server is running.");
      console.error(err);
    }

    setLoading(false);
    inputEl.focus();
  }
</script>

</body>
</html>
